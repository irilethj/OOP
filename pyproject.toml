[tool.poetry]
name = "oop"
version = "0.1.0"
description = ""
authors = ["Bekbolot Saribaev <saribaev93@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pytest = "^8.4.2"
mypy = "^1.18.2"
ruff = "^0.14.2"
pre-commit = "^4.3.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
#allow_any_return = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

# ослабленные правила только для тестов
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
force-exclude = true
